<!doctype html><html lang="en-AU"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compulsory Voting | Essay Builder</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f2f8;color:#24243c;font:16px system-ui,sans-serif}main{max-width:850px;margin:auto;background:white;min-height:100vh;padding:0 32px 36px}header{background:#29249c;color:white;text-align:center;border-radius:0 0 22px 22px;padding:22px 14px}h1{margin:0;font-size:27px}header p{margin:6px 0 0}h2{color:#29249c;font-size:20px;margin:0}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #29249c;border-radius:8px;padding:10px 18px;background:white;color:#29249c;font-weight:650}button.active,button.primary{background:#29249c;color:white}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #9b9af0;outline-offset:2px}.controls{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.name{width:100%;padding:10px;border:1px solid #c7c8d9;border-radius:7px;margin:7px 0 15px}.meter{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid #ddd;padding:12px 0;box-shadow:0 4px 8px #00000007}.meterline,.sectionhead,.promptline{display:flex;align-items:baseline;justify-content:space-between;gap:12px}.meterline strong{font-size:22px;color:#29249c}progress{width:100%;height:12px;accent-color:#29249c}.hint,.count{font-size:13px;color:#62647a}.section{padding:22px 0;border-bottom:1px solid #e2e2ee}.prompt{margin-top:15px}.promptline label{color:#29249c;font-size:15px;font-weight:600}.count{white-space:nowrap}.count.good{color:#167548}textarea{display:block;width:100%;min-height:76px;resize:vertical;border:1px solid #d8d9e6;border-radius:7px;padding:10px;margin-top:6px;line-height:1.5;color:#202035;background:#fdfdff}footer{padding-top:24px}.actions{display:flex;flex-wrap:wrap;gap:10px}#preview{white-space:pre-wrap;line-height:1.65;background:#f7f7fc;padding:18px;border-radius:8px}#status{font-size:14px;min-height:20px}button:disabled{opacity:.5;cursor:not-allowed}@media(max-width:550px){main{padding:0 15px 25px}.promptline{align-items:flex-start}.sectionhead{align-items:flex-start}h1{font-size:22px}}@media print{.controls,.actions,.meter,.name,.name-label,#status,footer .hint{display:none}main{padding:0}.section{break-inside:avoid}textarea{border:0}}
.checklist{margin:18px 0;padding:16px 20px;background:#f7f7ff;border:1px solid #dcdcf0;border-radius:10px;color:#29249c}.checklist h2{margin:0 0 10px;font-size:18px}.checklist label{display:flex;align-items:flex-start;gap:9px;margin:9px 0;line-height:1.45;font-size:14px;cursor:pointer}.checklist input{accent-color:#29249c;flex:none;width:17px;height:17px;margin:3px 0 0}.checklist input:checked+span{text-decoration:line-through;opacity:.65}</style><main><header><h1>Persuasive Essay Builder</h1><p>Should voting be compulsory in Australia?</p></header><div class="controls"><button id="for" class="active" aria-pressed="true">FOR compulsory voting</button><button id="against" aria-pressed="false">AGAINST compulsory voting</button></div><label class="name-label" for="student">Your name</label><input class="name" id="student" placeholder="First name and surname" autocomplete="name"><div class="meter"><div class="meterline"><strong id="total">0 words</strong><span>Goal: 200–400 words</span></div><progress id="progress" max="400" value="0"></progress></div><aside class="checklist" aria-labelledby="checktitle"><h2 id="checktitle">Persuasive Writing Checklist</h2><label><input type="checkbox" id="check0"><span><strong>Use high modality words</strong> such as must, should, certainly, absolutely and cannot.</span></label><label><input type="checkbox" id="check1"><span><strong>Use at least two rhetorical questions</strong> such as “Shouldn't every Australian have a say?” or “Is it fair to force people to vote?”</span></label><label><input type="checkbox" id="check2"><span><strong>Use facts, statistics or real examples</strong> to support your arguments. Make sure your facts are accurate.</span></label><label><input type="checkbox" id="check3"><span><strong>Use emotive language</strong> such as fairness, freedom, responsibility and injustice to appeal to your reader's feelings.</span></label><label><input type="checkbox" id="check4"><span><strong>Use persuasive connectives</strong> such as furthermore, more importantly, however and therefore to link your ideas.</span></label></aside><div id="sections"></div><footer><h2>Your finished essay</h2><div id="preview"></div><p id="status" role="status"></p><div class="actions"><button class="primary" id="email">✉ Email Mr C</button><button id="copy">Copy essay</button><button id="clear">Clear this draft</button></div></footer></main><script>
const commonEnd=['Restate your position using different words.','Summarise your two strongest arguments.'];
const plans={for:[['Introduction',['Ask a powerful question about having a say in Australia’s future.','Explain what compulsory voting means.','Clearly state why voting should remain compulsory.']],['Body Paragraph 1 – Fair Representation',['Explain why everyone should have a say in who governs Australia.','Provide an example or evidence about different groups of voters.','Explain how compulsory voting makes democracy fairer.']],['Body Paragraph 2 – Civic Responsibility',['Explain why voting is an important responsibility of citizens.','Compare voting with another responsibility Australians have.','Explain how voting helps Australia as a nation.']],['Body Paragraph 3 – Counterargument',['Acknowledge that some people believe voting should be a personal choice.','Explain why the responsibility to vote is more important.','Reinforce why compulsory voting benefits Australians.']],['Conclusion',[...commonEnd,'Finish with a powerful statement about Australia’s democratic future.']]],against:[['Introduction',['Ask a powerful question about freedom of choice.','Explain what compulsory voting means.','Clearly state why voting should become voluntary.']],['Body Paragraph 1 – Freedom of Choice',['Explain why Australians should be free to choose whether to vote.','Provide an example of another freedom Australians enjoy.','Explain why requiring people to vote could be considered unfair.']],['Body Paragraph 2 – Informed Voting',['Explain why voters should understand who and what they are voting for.','Describe what might happen when uninterested people are required to vote.','Explain how voluntary voting could encourage more thoughtful decisions.']],['Body Paragraph 3 – Counterargument',['Acknowledge that some people believe compulsory voting makes democracy fairer.','Explain why having the freedom to vote or not vote is also democratic.','Reinforce why voting should be a personal choice.']],['Conclusion',[...commonEnd,'Finish with a powerful statement about freedom in Australia.']]]};
const ranges=[[[10,20],[15,25],[10,20]],[[15,25],[20,35],[15,25]],[[15,25],[20,35],[15,25]],[[15,25],[20,35],[15,25]],[[10,15],[15,25],[10,20]]];
const $=id=>document.getElementById(id);let side='for',drafts={for:Array(15).fill(''),against:Array(15).fill('')};let checks={for:Array(5).fill(false),against:Array(5).fill(false)};const key='voting-essay-builder-v1';try{let s=JSON.parse(localStorage.getItem(key));if(s){for(const k of ['for','against'])if(Array.isArray(s.checks?.[k])&&s.checks[k].length===5)checks[k]=s.checks[k];for(const k of ['for','against'])if(Array.isArray(s.drafts?.[k])&&s.drafts[k].length===15)drafts[k]=s.drafts[k];if(plans[s.side])side=s.side;$('student').value=s.name||''}}catch(e){}function save(){try{localStorage.setItem(key,JSON.stringify({side,drafts,checks,name:$('student').value}))}catch(e){}}function words(s){return (s.match(/[\p{L}\p{N}]+(?:[’'\-][\p{L}\p{N}]+)*/gu)||[]).length}function essay(){return plans[side].map((_,i)=>drafts[side].slice(i*3,i*3+3).map(s=>s.trim()).filter(Boolean).join(' ')).filter(Boolean).join('\n\n')}function render(){checks[side].forEach((v,i)=>{$('check'+i).checked=v;$('check'+i).onchange=e=>{checks[side][i]=e.target.checked;save()}});for(const k of ['for','against']){$(k).classList.toggle('active',k===side);$(k).setAttribute('aria-pressed',k===side)}$('sections').innerHTML=plans[side].map(([title,prompts],i)=>`<section class="section"><div class="sectionhead"><h2>${title}</h2><span class="count" id="sc${i}"></span></div>${prompts.map((p,j)=>{let n=i*3+j,[a,b]=ranges[i][j];return `<div class="prompt"><div class="promptline"><label for="t${n}">0${j+1} ${p}</label><span class="count" id="c${n}"></span></div><textarea id="t${n}" placeholder="Aim for ${a}–${b} words"></textarea></div>`}).join('')}</section>`).join('');drafts[side].forEach((v,n)=>{$('t'+n).value=v;$('t'+n).addEventListener('input',e=>{drafts[side][n]=e.target.value;update();save()})});update()}function update(){let total=0;for(let i=0;i<5;i++){let sum=0,lo=0,hi=0;for(let j=0;j<3;j++){let n=i*3+j,w=words(drafts[side][n]),[a,b]=ranges[i][j];sum+=w;lo+=a;hi+=b;$('c'+n).textContent=`${w} / ${a}–${b} words`;$('c'+n).classList.toggle('good',w>=a&&w<=b)}$('sc'+i).textContent=`${sum} / ${lo}–${hi} words`;total+=sum}$('total').textContent=total+' words';$('progress').value=Math.min(400,total);$('preview').textContent=essay()||'Your paragraphs will appear here as you write.';$('email').disabled=!total;$('copy').disabled=!total}for(const k of ['for','against'])$(k).onclick=()=>{side=k;render();save();$('status').textContent=''};$('student').oninput=save;$('clear').onclick=()=>{if(confirm('Clear all writing for this position? Your other draft will remain.')){drafts[side]=Array(15).fill('');checks[side]=Array(5).fill(false);render();save();$('status').textContent='Draft cleared.'}};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(essay());$('status').textContent='Essay copied.'}catch(e){let r=document.createRange();r.selectNodeContents($('preview'));let s=window.getSelection();s.removeAllRanges();s.addRange(r);$('status').textContent='Essay selected. Press Ctrl+C or Command+C to copy.'}};$('email').onclick=()=>{let name=$('student').value.trim();if(!name){$('status').textContent='Please enter your name first.';$('student').focus();return}let count=words(essay());if((count<200||count>400)&&!confirm('Your essay is outside the 200–400 word target. Email it anyway?'))return;let subject=`Compulsory voting essay – ${name} – ${side.toUpperCase()}`,body=`Student: ${name}\nPosition: ${side.toUpperCase()} compulsory voting\nWord count: ${count}\n\n${essay()}`;window.location.href='mailto:nic@eq.edu.au?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);$('status').textContent='Check your email app for the prepared message. You still need to press Send.'};render();</script></html>
